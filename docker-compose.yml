services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${SHOPSHEET_BACKEND_PORT:-8000}:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    ports:
      - "${SHOPSHEET_FRONTEND_PORT:-5173}:80"
