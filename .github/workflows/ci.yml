name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run backend tests
        run: python -m pytest -q --cov=shopsheet --cov-report=term-missing --cov-fail-under=90
      - name: Run backend lint
        run: python -m ruff check src tests
      - name: Audit Python dependencies
        run: python -m pip_audit -r requirements.txt

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=high
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend dist for nginx image
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Validate Compose config
        run: docker compose config
      - name: Build Docker images
        run: docker compose build
      - name: Run Docker runtime smoke test
        env:
          SHOPSHEET_BACKEND_PORT: "18000"
          SHOPSHEET_FRONTEND_PORT: "15173"
        run: |
          docker compose up -d --wait
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:18000/health && break
            echo "waiting for backend to serve ($i)..."; sleep 2
          done
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:15173/api/demo-report > /dev/null && break
            echo "waiting for frontend proxy ($i)..."; sleep 2
          done
          curl -fsS http://127.0.0.1:18000/health
          curl -fsS http://127.0.0.1:15173 > /dev/null
          curl -fsS http://127.0.0.1:15173/api/demo-report | python -m json.tool > /dev/null
          curl -fsS http://127.0.0.1:15173/api/demo-export/issue_rows.csv | grep "source_table"
      - name: Stop Docker runtime
        if: always()
        env:
          SHOPSHEET_BACKEND_PORT: "18000"
          SHOPSHEET_FRONTEND_PORT: "15173"
        run: docker compose down --remove-orphans

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run browser workflow test
        working-directory: frontend
        run: npm run e2e
